name: Mirror to Hugging Face

# Pushes a copy of this repository to the Hugging Face dataset Sahek/ames
# on every push to the default branch. Needs a repository secret named HF_TOKEN
# (a Hugging Face token with write access). Without it the job does nothing.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: Sahek/ames
    steps:
      - name: Check for HF_TOKEN
        id: gate
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN secret is not set, skipping the Hugging Face mirror."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          lfs: true

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Push to Hugging Face
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet "huggingface_hub>=0.30"
          python - <<'PY'
          import os, subprocess
          from datetime import datetime, timezone
          from huggingface_hub import HfApi, CommitOperationDelete

          repo = os.environ["HF_REPO"]
          gh = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          api = HfApi(token=os.environ["HF_TOKEN"])

          with open("MIRROR_PROVENANCE.md", "w") as f:
              f.write(
                  f"# Mirror provenance\n\n"
                  f"This dataset is an automatic mirror of https://github.com/{gh}.\n\n"
                  f"- Source commit: https://github.com/{gh}/commit/{sha}\n"
                  f"- Mirrored at: {datetime.now(timezone.utc).isoformat(timespec='seconds')}\n\n"
                  f"Please open issues and pull requests on GitHub, not here.\n"
              )

          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          local = {p for p in tracked if not p.startswith(".github/")} | {"MIRROR_PROVENANCE.md"}

          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_folder(
              repo_id=repo, repo_type="dataset", folder_path=".",
              allow_patterns=sorted(local),
              commit_message=f"Mirror {gh}@{sha[:7]}",
          )
          stale = [p for p in api.list_repo_files(repo, repo_type="dataset")
                   if p not in local and p != ".gitattributes"]
          if stale:
              api.create_commit(
                  repo_id=repo, repo_type="dataset",
                  operations=[CommitOperationDelete(path_in_repo=p) for p in stale],
                  commit_message=f"Remove files no longer in {gh}",
              )
          print(f"Mirrored {len(local)} files to https://huggingface.co/datasets/{repo}, removed {len(stale)} stale files")
          PY
